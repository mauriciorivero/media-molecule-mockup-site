<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaMolecule</title>
    <!DOCTYPE html>
      <link rel="stylesheet" href="style.css">
</html>

</head>
    

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         BARRA DE NAVEGACIÓN
    ========================== -->

    <header class="navbar">

        <div class="logo">
            <span class="mm">Mm</span>

            <div class="molecule-icon">
                <span class="node node1"></span>
                <span class="node node2"></span>
                <span class="node node3"></span>

                <span class="line line1"></span>
                <span class="line line2"></span>
            </div>
        </div>


        <nav class="menu">

            <a href="#">About</a>
            <a href="#">Games</a>
            <a href="#">Blog</a>
            <a href="#">Careers</a>

        </nav>

    </header>


    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================== -->

    <main class="hero">

        <!-- Mancha rosa -->
        <div class="pink-shape"></div>


        <!-- Texto principal -->

        <section class="hero-text">

            <div class="we-are">

                <span class="we">We</span>

                <span class="are">Are</span>

            </div>


            <h1>
                Media<br>
                Molecule
            </h1>


            <p>
                We create inspiring entertainment that
                empowers player expression and fosters
                positive communities.
            </p>


            <a href="#" class="about-button">
                About Us
            </a>

        </section>



        <!-- =========================
             COMPOSICIÓN CENTRAL
        ========================== -->

        <section class="artwork">


            <!-- Mancha de pintura morada -->

            <img
                class="purple-paint"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/purple-paint-stroke.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Pintura morada"
            >


            <!-- Confeti -->

            <img
                class="confetti"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/dot-patterns.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Confeti"
            >


            <!-- Luna -->

            <img
                class="moon"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/moon.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Luna"
            >


            <!-- Círculo amarillo -->

            <img
                class="yellow-ring"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/yellow-circle-hollow.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Círculo amarillo"
            >


            <!-- Personaje morado -->

            <img
                class="purple-character"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/playstation-move-cursor.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Personaje"
            >


            <!-- Lana -->

            <img
                class="wool"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/wool.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Lana"
            >


            <!-- Rayo azul -->

            <img
                class="blue-lightning"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/zigzag-blue.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Rayo azul"
            >


            <!-- Rayo celeste -->

            <img
                class="light-blue-lightning"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/zigzag-light-blue.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Rayo"
            >


            <!-- Espiral naranja -->

            <img
                class="orange-shape"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/swirl-orange.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Espiral naranja"
            >


            <!-- Espiral verde -->

            <img
                class="green-shape"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/swirl-green.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Espiral verde"
            >


            <!-- Control PlayStation -->

            <img
                class="controller"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/playstation-controller.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Control"
            >


            <!-- Personaje Tearaway -->

            <img
                class="tearaway"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/tearaway-pig.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Personaje Tearaway"
            >


            <!-- Ave -->

            <img
                class="heron"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/heron.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Ave"
            >


            <!-- Máscara BAFTA -->

            <img
                class="mask"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/bafta-mask.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Máscara"
            >


            <!-- Zapato -->

            <img
                class="shoe"
                src="https://www.mediamolecule.com/media/Homepage/Hero%20Atom/rainbow-shoe.png?rmode=min&token=uOd1CiIFXNDNvrLIK4fD1Q9z7CbBIJTGZrtF5LxTKqY%3D&width=2560"
                alt="Zapato"
            >

        </section>

    </main>


    <!-- Botón de configuración -->

    <div class="settings">
        ⚙
    </div>


</body>
</html>
